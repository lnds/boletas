<!doctype html>
<html lang="es-CL">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calculadora de boletas de honorarios</title>
<style>
  :root {
    --bg: #f4f5f7;
    --surface: #ffffff;
    --surface-2: #f0f2f5;
    --border: #dfe3e8;
    --text: #1b1f24;
    --muted: #5c6672;
    --accent: #2f6feb;
    --accent-soft: #e8f0fe;
    --danger: #b4341f;
    --ok: #1a7f4b;
    --radius: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171b;
      --surface: #1c2026;
      --surface-2: #23282f;
      --border: #333a43;
      --text: #e8eaed;
      --muted: #9aa4b0;
      --accent: #6f9bff;
      --accent-soft: #22304d;
      --danger: #ef7a63;
      --ok: #52c98a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 32px 16px 64px;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif;
  }
  .wrap { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: -0.01em; }
  .sub { color: var(--muted); margin: 0 0 24px; font-size: 14px; }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 16px;
  }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 16px; }
  label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
  .hint { font-weight: 400; color: var(--muted); font-size: 12px; }
  input[type=number], input[type=date], select {
    width: 100%;
    padding: 10px 12px;
    font-size: 16px;
    color: var(--text);
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    font-variant-numeric: tabular-nums;
  }
  input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .segmented { display: flex; gap: 8px; flex-wrap: wrap; }
  .segmented input { position: absolute; opacity: 0; pointer-events: none; }
  .segmented label {
    flex: 1 1 140px;
    margin: 0;
    padding: 10px 12px;
    text-align: center;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--surface-2);
    cursor: pointer;
    font-weight: 500;
    font-size: 14px;
  }
  .segmented input:checked + label {
    border-color: var(--accent);
    background: var(--accent-soft);
    color: var(--accent);
    font-weight: 600;
  }
  .row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
    padding: 11px 0;
    border-bottom: 1px dashed var(--border);
  }
  .row:last-child { border-bottom: 0; }
  .row .k { color: var(--muted); font-size: 14px; }
  .row .v { font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
  .row.total { border-top: 2px solid var(--border); border-bottom: 0; margin-top: 6px; padding-top: 14px; }
  .row.total .k { color: var(--text); font-weight: 600; font-size: 15px; }
  .row.total .v { font-size: 22px; color: var(--ok); }
  .neg .v { color: var(--danger); }
  .uf-line { display: flex; gap: 8px; align-items: center; }
  .uf-line input { flex: 1; }
  button {
    padding: 10px 14px;
    font-size: 14px;
    font-weight: 600;
    color: var(--accent);
    background: var(--accent-soft);
    border: 1px solid var(--border);
    border-radius: 8px;
    cursor: pointer;
    white-space: nowrap;
  }
  button:hover { border-color: var(--accent); }
  .status { font-size: 12px; color: var(--muted); margin-top: 6px; min-height: 16px; }
  .note {
    background: var(--surface-2);
    border-left: 3px solid var(--accent);
    border-radius: 6px;
    padding: 12px 14px;
    font-size: 13px;
    color: var(--muted);
    margin-top: 14px;
  }
  .note strong { color: var(--text); }
  footer { color: var(--muted); font-size: 12px; text-align: center; margin-top: 24px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 0 0 14px; }
  .head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 14px; }
  .head h2 { margin: 0; }
  .head button { padding: 7px 12px; font-size: 13px; }
  button.copiado { color: var(--ok); border-color: var(--ok); background: transparent; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Calculadora de boletas de honorarios</h1>
  <p class="sub">Montos en UF, con retención según la Ley 21.133 (aumento gradual hasta 17% en 2028).</p>

  <div class="card">
    <h2>Datos de la boleta</h2>
    <div class="grid">
      <div>
        <label for="uf">Monto <span class="hint">(UF)</span></label>
        <input type="number" id="uf" value="10" min="0" step="0.01" inputmode="decimal">
      </div>
      <div>
        <label for="fecha">Fecha de la boleta</label>
        <input type="date" id="fecha">
        <div class="status" id="tasaStatus"></div>
      </div>
      <div>
        <label for="valorUf">Valor de la UF <span class="hint">(pesos)</span></label>
        <div class="uf-line">
          <input type="number" id="valorUf" value="40000" min="0" step="0.01" inputmode="decimal">
          <button type="button" id="btnUf">Buscar UF</button>
        </div>
        <div class="status" id="ufStatus"></div>
      </div>
      <div>
        <label for="tasa">Tasa de retención <span class="hint">(%)</span></label>
        <input type="number" id="tasa" step="0.01" min="0" max="100">
      </div>
    </div>

    <div style="margin-top:18px">
      <label>El monto en UF que ingresé es…</label>
      <div class="segmented">
        <input type="radio" name="base" id="base-bruto" value="bruto" checked>
        <label for="base-bruto">Bruto (lo que boleteo)</label>
        <input type="radio" name="base" id="base-liquido" value="liquido">
        <label for="base-liquido">Líquido (lo que quiero recibir)</label>
      </div>
    </div>

    <div style="margin-top:18px">
      <label>¿El cliente retiene el impuesto?</label>
      <div class="segmented">
        <input type="radio" name="retiene" id="ret-si" value="si" checked>
        <label for="ret-si">Sí — empresa o institución</label>
        <input type="radio" name="retiene" id="ret-no" value="no">
        <label for="ret-no">No — persona natural</label>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="head">
      <h2>Resultado</h2>
      <button type="button" id="btnCopiar">Copiar resultado</button>
    </div>
    <div id="salida"></div>
    <div class="note" id="nota"></div>
  </div>

  <footer>Cálculo referencial. La retención efectiva es la vigente a la fecha de emisión de la boleta en el SII.</footer>
</div>

<script>
// Ley 21.133: aumento gradual de la retención de honorarios.
const TASAS = {
  2019: 10.00, 2020: 10.75, 2021: 11.50, 2022: 12.25, 2023: 13.00,
  2024: 13.75, 2025: 14.50, 2026: 15.25, 2027: 16.00, 2028: 17.00
};
const ANIOS = Object.keys(TASAS).map(Number);
const CACHE_UF = 'uf:';

const $ = id => document.getElementById(id);
let resumen = '';
const clp = n => new Intl.NumberFormat('es-CL', { style: 'currency', currency: 'CLP', maximumFractionDigits: 0 }).format(Math.round(n));
const uf = n => new Intl.NumberFormat('es-CL', { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(n) + ' UF';

// La fecha se maneja como YYYY-MM-DD en horario local: convertirla a Date
// desplazaría el día por zona horaria.
function hoyISO() {
  const d = new Date();
  return [d.getFullYear(), d.getMonth() + 1, d.getDate()]
    .map((n, i) => i ? String(n).padStart(2, '0') : n).join('-');
}
const anioDe = iso => Number(iso.slice(0, 4));
const aFormatoApi = iso => iso.split('-').reverse().join('-');
const legible = iso => {
  const [a, m, d] = iso.split('-').map(Number);
  return new Date(a, m - 1, d).toLocaleDateString('es-CL', { day: '2-digit', month: 'long', year: 'numeric' });
};

// Fuera del tramo legislado se usa la tasa del extremo más cercano.
function tasaDeFecha(iso) {
  const a = anioDe(iso);
  if (TASAS[a]) return { tasa: TASAS[a], exacta: true, anio: a };
  const cercano = a < Math.min(...ANIOS) ? Math.min(...ANIOS) : Math.max(...ANIOS);
  return { tasa: TASAS[cercano], exacta: false, anio: cercano };
}

function sincronizarTasa() {
  const iso = $('fecha').value || hoyISO();
  const { tasa, exacta, anio } = tasaDeFecha(iso);
  $('tasa').value = tasa.toFixed(2);
  $('tasaStatus').textContent = exacta
    ? `Retención vigente ${anio}: ${tasa.toFixed(2)}%`
    : `Sin tasa legislada para ${anioDe(iso)}; se usa la de ${anio}`;
}

function fila(k, v, clase) {
  return `<div class="row ${clase || ''}"><span class="k">${k}</span><span class="v">${v}</span></div>`;
}

function calcular() {
  const montoUf = parseFloat($('uf').value) || 0;
  const valorUf = parseFloat($('valorUf').value) || 0;
  const t = (parseFloat($('tasa').value) || 0) / 100;
  const esBruto = document.querySelector('input[name=base]:checked').value === 'bruto';
  const retiene = document.querySelector('input[name=retiene]:checked').value === 'si';

  const monto = montoUf * valorUf;
  // Si el monto ingresado es líquido, se hace el gross-up para llegar al bruto.
  // El SII opera en pesos enteros: el bruto se fija primero y de ahí se derivan
  // retención y líquido, para que las cifras calcen con la boleta emitida.
  // Partiendo del líquido se redondea hacia arriba, para nunca quedar corto.
  const bruto = esBruto
    ? Math.round(monto)
    : (t < 1 ? Math.ceil(monto / (1 - t)) : 0);
  const impuesto = Math.round(bruto * t);
  const liquido = bruto - impuesto;
  const brutoEnUf = valorUf > 0 ? bruto / valorUf : 0;

  let html = '';
  const texto = [];
  html += fila('Monto bruto de la boleta', `${clp(bruto)} <span class="hint">· ${uf(brutoEnUf)}</span>`);
  texto.push(`Monto bruto de la boleta: ${clp(bruto)} (${uf(brutoEnUf)})`);

  if (retiene) {
    html += fila(`Retención del cliente (${($('tasa').value)}%)`, '− ' + clp(impuesto), 'neg');
    html += fila('Te depositan', clp(liquido), 'total');
    texto.push(`Retención del cliente (${$('tasa').value}%): -${clp(impuesto)}`);
    texto.push(`Te depositan: ${clp(liquido)}`);
    $('nota').innerHTML = '<strong>El cliente retiene.</strong> Declara y entera esa retención en el SII a tu nombre; tú recibes el líquido y no pagas PPM por esta boleta. Queda como crédito en tu declaración anual de renta (abril), donde puede resultar devolución o pago según tu tramo.';
  } else {
    html += fila('Te depositan', clp(bruto));
    html += fila(`PPM que debes pagar tú (${($('tasa').value)}%)`, '− ' + clp(impuesto), 'neg');
    html += fila('Te queda después del PPM', clp(liquido), 'total');
    texto.push(`Te depositan: ${clp(bruto)}`);
    texto.push(`PPM que debes pagar tú (${$('tasa').value}%): -${clp(impuesto)}`);
    texto.push(`Te queda después del PPM: ${clp(liquido)}`);
    $('nota').innerHTML = '<strong>El cliente no retiene.</strong> Recibes el monto bruto completo, pero debes declarar y pagar el PPM en el Formulario 29 dentro del mes siguiente. Aparta esa plata: no es tuya. También es crédito en la declaración anual de renta.';
  }

  $('salida').innerHTML = html;

  const iso = $('fecha').value || hoyISO();
  resumen = [
    `Boleta de honorarios · ${legible(iso)}`,
    `Monto: ${uf(montoUf)} ${esBruto ? '(bruto)' : '(líquido deseado)'} · UF a ${clp(valorUf)}`,
    `Cliente ${retiene ? 'retiene' : 'no retiene'} el impuesto`,
    '',
    ...texto
  ].join('\n');
}

async function copiar() {
  const btn = $('btnCopiar');
  try {
    await navigator.clipboard.writeText(resumen);
  } catch (e) {
    // Respaldo donde la Clipboard API no está disponible.
    const ta = document.createElement('textarea');
    ta.value = resumen;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    const ok = document.execCommand('copy');
    ta.remove();
    if (!ok) {
      btn.textContent = 'No se pudo copiar';
      setTimeout(() => { btn.textContent = 'Copiar resultado'; }, 1800);
      return;
    }
  }
  btn.textContent = '✓ Copiado';
  btn.classList.add('copiado');
  setTimeout(() => { btn.textContent = 'Copiar resultado'; btn.classList.remove('copiado'); }, 1800);
}

function fijarUf(valor, iso, nota) {
  $('valorUf').value = valor;
  localStorage.setItem(CACHE_UF + iso, valor);
  localStorage.setItem('valorUf', valor);
  $('ufStatus').textContent = nota || `UF al ${legible(iso)}`;
  calcular();
}

// La UF de una fecha es un dato fijo, así que se guarda para no volver a pedirlo.
async function buscarUf({ silencioso = false } = {}) {
  const iso = $('fecha').value || hoyISO();
  const st = $('ufStatus');
  const cacheada = localStorage.getItem(CACHE_UF + iso);
  if (cacheada) {
    fijarUf(cacheada, iso);
    if (silencioso) return;
  }
  st.textContent = 'Consultando mindicador.cl…';
  try {
    const r = await fetch(`https://mindicador.cl/api/uf/${aFormatoApi(iso)}`);
    if (!r.ok) throw new Error(r.status);
    const dato = (await r.json()).serie[0];
    if (dato) return fijarUf(dato.valor, iso);

    // Sin dato para esa fecha (feriado o UF aún no publicada): se usa la última vigente.
    const r2 = await fetch('https://mindicador.cl/api/uf');
    if (!r2.ok) throw new Error(r2.status);
    const ultimo = (await r2.json()).serie[0];
    const isoUltimo = ultimo.fecha.slice(0, 10);
    fijarUf(ultimo.valor, isoUltimo, `Sin UF publicada para el ${legible(iso)}; se usa la del ${legible(isoUltimo)}`);
  } catch (e) {
    st.textContent = cacheada
      ? `UF al ${legible(iso)} (guardada)`
      : 'No se pudo consultar la UF. Ingrésala a mano.';
  }
}

$('fecha').value = hoyISO();
sincronizarTasa();
const guardado = localStorage.getItem('valorUf');
if (guardado) $('valorUf').value = guardado;

$('fecha').addEventListener('change', () => {
  sincronizarTasa();
  buscarUf();
});
$('valorUf').addEventListener('change', e => localStorage.setItem('valorUf', e.target.value));
document.querySelectorAll('input, select').forEach(el => el.addEventListener('input', calcular));
$('btnUf').addEventListener('click', () => buscarUf());
$('btnCopiar').addEventListener('click', copiar);

calcular();
buscarUf({ silencioso: true });
</script>
</body>
</html>
